name: Build and test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install screenshot reporter dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh jq
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run unit tests
        run: ./gradlew :composeApp:assembleDebug :composeApp:verifyPaparazziDebug --stacktrace
      - name: Report screenshot diffs on PR
        # Runs even if screenshot verification failed so Paparazzi's generated
        # expected/actual/diff images are still visible on the PR.
        if: always() && github.event_name == 'pull_request'
        env:
          CLASSIC_TOKEN: ${{ secrets.CLASSIC_TOKEN }}
        run: |
          zsh screenShotScript/screenShotCompare.sh \
            --paparazzi composeApp/build composeApp/src/test/snapshots false
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            composeApp/build/reports/tests/testDebugUnitTest/
            composeApp/build/test-results/testDebugUnitTest/
            composeApp/build/reports/paparazzi/
            composeApp/build/paparazzi/
            composeApp/src/test/snapshots/
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS build and tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-screenshots.txt
      - name: Install screenshot comparison dependencies
        run: python -m pip install -r scripts/requirements-screenshots.txt
      - uses: gradle/actions/setup-gradle@v4
      - name: Select an available iPhone simulator
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, candidates in devices.items():
              if runtime == "com.apple.CoreSimulator.SimRuntime.iOS-26-0":
                  for device in candidates:
                      if device["name"] == "iPhone 17 Pro":
                          print(device["udid"])
                          sys.exit(0)
          sys.exit("No available iPhone simulator found")
          ')
          echo "IOS_SIMULATOR_UDID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run shared tests on iOS simulator
        run: ./gradlew :composeApp:iosSimulatorArm64Test -PiosSimulatorDevice="$IOS_SIMULATOR_UDID" --stacktrace
      - name: Verify iOS screenshots
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR_UDID"
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/ios-screenshots.py --app build/ios/Build/Products/Debug-iphonesimulator/iosApp.app
      - name: Report screenshot diffs on PR
        # Best-effort: posts/updates a PR comment with the expected/actual/diff
        # images via GitHub's own attachment hosting (no external server or
        # secrets needed). Runs even when the step above failed so the diff
        # that caused the failure is visible on the PR; never fails the job
        # itself, since GITHUB_TOKEN is read-only for fork PRs.
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/report_screenshot_diffs.py \
            --platform ios \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --ios-output-dir build/screenshots/ios
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: |
            composeApp/build/reports/tests/iosSimulatorArm64Test/
            composeApp/build/test-results/iosSimulatorArm64Test/
            build/screenshots/ios/
