name: Build and test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android build and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run unit tests
        run: ./gradlew :composeApp:assembleDebug :composeApp:verifyPaparazziDebug --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            composeApp/build/reports/tests/testDebugUnitTest/
            composeApp/build/test-results/testDebugUnitTest/
            composeApp/build/reports/paparazzi/
            composeApp/build/paparazzi/
            composeApp/src/test/snapshots/
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS build and tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-screenshots.txt
      - name: Install screenshot comparison dependencies
        run: python -m pip install -r scripts/requirements-screenshots.txt
      - uses: gradle/actions/setup-gradle@v4
      - name: Select an available iPhone simulator
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          # Pick the newest available iOS runtime, preferring "iPhone 17 Pro"
          # among its devices and otherwise falling back to the newest plain
          # iPhone it has, so a newer Xcode (with a newer default runtime, or
          # without "iPhone 17 Pro" preinstalled) keeps working. Plain-iPhone
          # names exclude exotic variants (e.g. "iPhone Duo"), which are not
          # safe fallbacks: they may have a different aspect ratio, or
          # legitimately expose more than one display themselves.
          ios_runtimes = [
              runtime for runtime in devices
              if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-") and devices[runtime]
          ]
          if not ios_runtimes:
              sys.exit("No available iPhone simulator found")
          def runtime_version(runtime):
              return tuple(int(part) for part in runtime.rsplit(".iOS-", 1)[1].split("-"))
          runtime = max(ios_runtimes, key=runtime_version)
          candidates = devices[runtime]
          device = next((d for d in candidates if d["name"] == "iPhone 17 Pro"), None)
          if device is None:
              iphone_re = re.compile(r"^iPhone (\d+)( Pro)?( Max)?$")
              plain_iphones = []
              for d in candidates:
                  match = iphone_re.match(d["name"])
                  if match:
                      plain_iphones.append((int(match.group(1)), bool(match.group(2)), d))
              if plain_iphones:
                  plain_iphones.sort(key=lambda entry: (entry[0], entry[1]), reverse=True)
                  device = plain_iphones[0][2]
              else:
                  device = candidates[0]
          print(device["udid"])
          ')
          echo "IOS_SIMULATOR_UDID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "id=$IOS_SIMULATOR_UDID" \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run shared tests on iOS simulator
        run: ./gradlew :composeApp:iosSimulatorArm64Test -PiosSimulatorDevice="$IOS_SIMULATOR_UDID" --stacktrace
      - name: Verify iOS screenshots
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR_UDID"
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/ios-screenshots.py --app build/ios/Build/Products/Debug-iphonesimulator/iosApp.app
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: |
            composeApp/build/reports/tests/iosSimulatorArm64Test/
            composeApp/build/test-results/iosSimulatorArm64Test/
            build/screenshots/ios/

  screenshot-report:
    name: Report screenshot diffs
    needs: [android, ios]
    if: always() && !cancelled() && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install screenshot reporter dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh jq
      - uses: actions/download-artifact@v4
        with:
          name: android-test-reports
          path: composeApp
      - uses: actions/download-artifact@v4
        with:
          name: ios-test-reports
          path: .
      - name: Report screenshot diffs on PR
        # A single writer replaces previous reports after both platforms finish.
        env:
          CLASSIC_TOKEN: ${{ secrets.CLASSIC_TOKEN }}
        run: |
          zsh screenShotScript/screenShotCompare.sh --combined \
            composeApp/build composeApp/src/test/snapshots build/screenshots/ios false
